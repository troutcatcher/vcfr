[package]
name = "vcfr"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "A fast VCF toolkit: merge, concat and subset VCF/BGZF files"
license = "MIT"
repository = "https://github.com/troutcatcher/vcfr"

[dependencies]
libdeflater = "1.26"
memchr = "2"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
